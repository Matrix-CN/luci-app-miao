name: Build OpenWrt 25.12 APK

on:
  workflow_dispatch:
    inputs:
      arch:
        description: '目标设备架构 (Target-Subtarget)'
        required: true
        default: 'x86-64'
        type: choice
        options:
          - 'x86-64'
          - 'armsr-armv8'
          - 'mediatek-filogic'
          - 'rockchip-armv8'
          - 'qualcommax-ipq807x'
      openwrt_branch:
        description: 'OpenWrt SDK 版本分支'
        required: true
        default: '25.12'
        type: choice
        options:
          - '25.12'
          - 'SNAPSHOT'
  push:
    branches: [ "main", "master" ]

jobs:
  build_openwrt_apk:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/openwrt/sdk:${{ github.event.inputs.arch || 'x86-64' }}-${{ github.event.inputs.openwrt_branch || '25.12-SNAPSHOT' }}
      options: --user root
    env:
      # 允许在容器内以 root 权限执行 configure 和 make
      FORCE_UNSAFE_CONFIGURE: 1

    steps:
      - name: 1. 检出源码到默认工作区
        uses: actions/checkout@v4

      - name: 2. 将源码拷贝至 SDK 的 /builder/package/miao
        run: |
          mkdir -p /builder/package/miao
          cp -rf "$GITHUB_WORKSPACE"/* /builder/package/miao/
          ls -la /builder/package/miao/

      - name: 3. 更新 Feeds 基础依赖 (在 /builder 目录下执行)
        working-directory: /builder
        run: |
          # 确保 git 信任容器内的目录
          git config --global --add safe.directory '*'
          
          # 拉取基础 feeds (base / packages / luci)
          ./scripts/feeds update base packages luci
          ./scripts/feeds install -a -p luci
          ./scripts/feeds install golang

      - name: 4. 生成默认配置并开启 APK 包管理器支持
        working-directory: /builder
        run: |
          make defconfig
          # 确保启用 OpenWrt 25.12 的 apk 包格式 (CONFIG_USE_APK)
          sed -i 's/# CONFIG_USE_APK is not set/CONFIG_USE_APK=y/g' .config
          grep -q "CONFIG_USE_APK=y" .config || echo "CONFIG_USE_APK=y" >> .config
          # 关闭安装包签名校验（或让 SDK 生成本地测试密钥），避免打包时报错
          sed -i 's/CONFIG_SIGNED_PACKAGES=y/# CONFIG_SIGNED_PACKAGES is not set/g' .config
          make defconfig

      - name: 5. 自动识别 Makefile 并编译生成 .apk
        working-directory: /builder
        run: |
          echo "正在扫描 /builder/package/miao 下的 Makefile..."
          find package/miao -name "Makefile" | sort | while read makefile; do
            pkg_dir=$(dirname "$makefile")
            echo "=========================================="
            echo ">>> 开始编译目录: $pkg_dir"
            echo "=========================================="
            make "$pkg_dir/compile" V=s -j$(nproc)
          done

      - name: 6. 整理生成的 .apk 软件包
        working-directory: /builder
        run: |
          mkdir -p /builder/output_apks
          # 查找编译产出的所有 .apk 包（仅提取我们编译的 miao 相关包或全部产出）
          find bin/packages/ -type f -name "*.apk" -exec cp -v {} /builder/output_apks/ \;
          echo ">>> 最终打包产出的 .apk 列表："
          ls -lh /builder/output_apks/

      - name: 7. 上传 OpenWrt APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-25.12-${{ github.event.inputs.arch || 'x86-64' }}-apks
          path: /builder/output_apks/*.apk
          if-no-files-found: error
